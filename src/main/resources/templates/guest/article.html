<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${article.title}">Article</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="page">

    <div class="header">
        <div>
            <h1 th:text="${article.title}">Article Title</h1>
            <p class="date">
                Published:
                <span th:text="${article.publishingDate}">Date</span>
            </p>
        </div>

        <a class="btn btn-secondary" href="/">Back Home</a>
    </div>

    <div class="card">
        <p class="article-content" th:text="${article.content}">
            Article content
        </p>
    </div>

</div>

</body>
</html>
